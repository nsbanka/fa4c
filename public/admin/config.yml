backend:
  name: git-gateway
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

site_url: https://fa4change.org
display_url: https://fa4change.org
logo_url: /images/logo.jpg

collections:
  - name: pages
    label: Pages
    files:
      - name: about
        label: About Us
        file: src/data/content/about.json
        fields:
          - { name: title, label: Page Title, widget: string }
          - { name: body, label: Content, widget: markdown }

      - name: audit_reports
        label: Audit Reports
        file: src/data/content/audit-reports.json
        fields:
          - name: reports
            label: Reports
            widget: list
            fields:
              - { name: year, label: Year (e.g. 2018–2019), widget: string }
              - name: file
                label: PDF File
                widget: file
                media_folder: public/pdfs
                public_folder: /pdfs

  - name: programmes
    label: Programmes
    label_singular: Programme
    folder: src/data/programmes
    create: false
    slug: '{{slug}}'
    fields:
      - { name: name, label: Programme Name, widget: string }
      - { name: order, label: Display Order, widget: number, default: 99 }
      - { name: description, label: Short Description, widget: text }
      - { name: body, label: Full Content, widget: markdown }
      - { name: image, label: Programme Image, widget: image, required: false }

  - name: press
    label: Press Coverage
    label_singular: Press Clipping
    folder: src/data/press
    create: true
    slug: '{{order}}-{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: image, label: Newspaper Clipping Image, widget: image }
      - { name: order, label: Display Order, widget: number, default: 99 }

  - name: faqs
    label: FAQs
    label_singular: FAQ
    folder: src/data/faqs
    create: true
    slug: '{{slug}}'
    fields:
      - { name: question, label: Question, widget: string }
      - { name: answer, label: Answer, widget: text }
      - { name: order, label: Display Order, widget: number, default: 99 }

  - name: gallery
    label: Gallery
    label_singular: Gallery Year
    folder: src/data/gallery-cms
    create: true
    slug: '{{year}}'
    fields:
      - { name: year, label: Year, widget: string }
      - name: images
        label: Photos
        widget: list
        fields:
          - { name: image, label: Photo, widget: image }
          - { name: alt, label: Description, widget: string }
